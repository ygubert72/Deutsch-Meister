<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Немецкий тренажер v1.3</title>
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/flags/4x3/de.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <!-- Панель пользователя -->
    <div class="user-panel">
        <button id="loginBtn" onclick="showLoginModal()">🔐 Войти</button>
        <div id="userInfo" style="display: none;"></div>
    </div>

    <div class="sidebar">
        <div class="sidebar-content">
            <button class="btn" id="toggleLessonsBtn">КУРС ГРАММАТИКИ ▶</button>
            <div id="lessonsPanel" style="display: none; margin-top: 10px;"></div>
            
            <div class="section-title">ТРЕНАЖЁР</div>
            <div class="levels-container" id="levelsContainer">
                <button data-level="A1" class="btn btn-level">A1</button>
                <button data-level="A2" class="btn btn-level active">A2</button>
                <button data-level="B1" class="btn btn-level">B1</button>
                <button data-level="B2" class="btn btn-level">B2</button>
                <button data-level="C1" class="btn btn-level">C1</button>
            </div>
            
            <div class="section-title">РЕЖИМЫ</div>
            <button data-mode="cards" class="btn mode-btn active">КАРТОЧКИ</button>
            <button data-mode="quiz" class="btn mode-btn">ТЕСТ</button>
            <button data-mode="sentences" class="btn mode-btn">ФРАЗЫ</button>
        </div>
    </div>
    <div class="main">
        <div class="top-bar"><span id="counter">Загрузка...</span></div>
        <div class="content" id="content"></div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/wordsManager.js"></script>
<script src="js/sentencesManager.js"></script>
<script src="js/cardsMode.js"></script>
<script src="js/quizMode.js"></script>
<script src="js/sentencesMode.js"></script>
<script src="js/lessonsMode.js"></script>
<script src="js/app.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
