<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    
    <title>Deutsch-Meister</title>
    
    <!-- Основная иконка (SVG) -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    
    <!-- Иконки для iOS (iPhone, iPad) -->
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="apple-touch-icon-precomposed" href="icons/icon.svg">
    
    <!-- Иконки для Android через SVG -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="icons/icon.svg">
    
    <!-- Цвет темы для браузера (Android) -->
    <meta name="theme-color" content="#3B6FE0">
    
    <!-- Для iOS: цвет статус-бара -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Deutsch-Meister">
    
    <!-- Для Android -->
    <meta name="application-name" content="Deutsch-Meister">
    <meta name="msapplication-TileColor" content="#3B6FE0">
    <meta name="msapplication-TileImage" content="icons/icon.svg">
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        .app { opacity: 0; transition: opacity 0.1s ease; }
        .app.loaded { opacity: 1; }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div class="sidebar-content">
            <button id="loginBtn" class="btn" style="margin-bottom: 10px;">🔐 Войти</button>
            <div id="userInfo" style="display: none; margin: 10px 0; padding: 8px; background: #E8F0FE; border-radius: 8px; text-align: center; font-size: 12px;"></div>
            <div class="levels-container" id="levelsContainer">
                <button data-level="A1" class="btn btn-level">A1</button>
                <button data-level="A2" class="btn btn-level">A2</button>
                <button data-level="B1" class="btn btn-level">B1</button>
                <button data-level="B2" class="btn btn-level">B2</button>
                <button data-level="C1" class="btn btn-level">C1</button>
            </div>
            <button data-mode="grammar" class="btn mode-btn">ГРАММАТИКА</button>
            <button data-mode="cards" class="btn mode-btn">КАРТОЧКИ</button>
            <button data-mode="quiz" class="btn mode-btn">ТЕСТ</button>
            <button data-mode="sentences" class="btn mode-btn">ТРЕНАЖЁР</button>
        </div>
    </div>
    <div class="main">
        <div class="top-bar"><span id="counter">Загрузка...</span></div>
        <div class="content" id="content"></div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/wordsManager.js"></script>
<script src="js/sentencesManager.js"></script>
<script src="js/cardsMode.js"></script>
<script src="js/quizMode.js"></script>
<script src="js/sentencesMode.js"></script>
<script src="js/grammarMode.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>

<script>
    window.addEventListener('load', function() {
        document.querySelector('.app').classList.add('loaded');
    });
    
    // Фикс прокрутки на телефонах
    setTimeout(function() {
        var content = document.querySelector('.content');
        if (content) {
            content.style.overflowY = 'auto';
            content.style.webkitOverflowScrolling = 'touch';
            content.style.paddingBottom = '50px';
        }
        var sidebar = document.querySelector('.sidebar');
        if (sidebar) {
            sidebar.style.overflowY = 'auto';
            sidebar.style.webkitOverflowScrolling = 'touch';
        }
    }, 500);
</script>
</body>
</html>
