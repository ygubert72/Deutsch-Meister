<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    
    <title>Deutsch-Meister</title>
    
    <!-- Основная иконка (SVG) -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    
    <!-- Иконки для iOS (iPhone, iPad) -->
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="apple-touch-icon-precomposed" href="icons/icon.svg">
    
    <!-- Иконки для Android через SVG -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="icons/icon.svg">
    
    <!-- Цвет темы для браузера (Android) -->
    <meta name="theme-color" content="#3B6FE0">
    
    <!-- Для iOS: цвет статус-бара -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Deutsch-Meister">
    
    <!-- Для Android -->
    <meta name="application-name" content="Deutsch-Meister">
    <meta name="msapplication-TileColor" content="#3B6FE0">
    <meta name="msapplication-TileImage" content="icons/icon.svg">
    
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* ===== СТИЛИ ДЛЯ ЛОАДЕРА ===== */
        .app { 
            opacity: 0; 
            transition: opacity 0.3s ease;
            display: none;
        }
        .app.loaded { 
            opacity: 1; 
            display: flex;
        }
        
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #F8F8F8;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.5s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #E0E0E0;
            border-top: 5px solid #3B6FE0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loader-text {
            margin-top: 20px;
            font-size: 16px;
            color: #666;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        
        .loader-logo {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .loader-dots::after {
            content: '';
            animation: dots 1.2s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }
    </style>
</head>
<body>

<!-- ===== ЛОАДЕР ===== -->
<div id="loader">
    <div class="loader-logo">🇩🇪</div>
    <div class="loader-spinner"></div>
    <div class="loader-text">Загрузка<span class="loader-dots"></span></div>
</div>

<!-- ===== ПРИЛОЖЕНИЕ ===== -->
<div class="app">
    <!-- Обычный сайдбар (для компьютеров) -->
    <div class="sidebar">
        <div class="sidebar-content">
            <button id="loginBtn" class="btn btn-login" style="margin-bottom: 10px;">🔐 Войти</button>
            <div id="userInfo" style="display: none; margin: 10px 0; padding: 8px; background: #E8F0FE; border-radius: 8px; text-align: center; font-size: 12px;"></div>
            <div class="levels-container" id="levelsContainer">
                <button data-level="A1" class="btn btn-level">A1</button>
                <button data-level="A2" class="btn btn-level">A2</button>
                <button data-level="B1" class="btn btn-level">B1</button>
                <button data-level="B2" class="btn btn-level">B2</button>
                <button data-level="C1" class="btn btn-level">C1</button>
            </div>
            <button data-mode="grammar" class="btn mode-btn">ГРАММАТИКА</button>
            <button data-mode="cards" class="btn mode-btn">КАРТОЧКИ</button>
            <button data-mode="quiz" class="btn mode-btn">ТЕСТ</button>
            <button data-mode="sentences" class="btn mode-btn">ТРЕНАЖЁР</button>
            <!-- Кнопка "Поделиться" для десктопа (скрывается для админа) -->
            <button id="shareBtnDesktop" class="btn btn-share" style="display: none; margin-top: 10px;">🔗 ПОДЕЛИТЬСЯ</button>
        </div>
    </div>
    
    <!-- Основной контент -->
    <div class="main">
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="hamburger-btn" id="hamburgerBtn">☰</button>
                <span id="modeIndicator" class="mode-indicator">Грамматика A1</span>
            </div>
            <span id="counter">Загрузка...</span>
        </div>
        <div class="content" id="content"></div>
    </div>
</div>

<!-- Мобильное меню (выезжающее) -->
<div class="menu-overlay" id="menuOverlay"></div>
<div class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu-header">
        <h3>📚 Deutsch-Meister</h3>
        <button class="close-menu-btn" id="closeMenuBtn">✕</button>
    </div>
    <div class="sidebar-content">
        <button id="loginBtnMobile" class="btn btn-login-mobile" style="margin-bottom: 10px;">🔐 Войти</button>
        <div id="userInfoMobile" style="display: none; margin: 10px 0; padding: 8px; background: #E8F0FE; border-radius: 8px; text-align: center; font-size: 12px;"></div>
        <div class="levels-container" id="levelsContainerMobile">
            <button data-level="A1" class="btn btn-level">A1</button>
            <button data-level="A2" class="btn btn-level">A2</button>
            <button data-level="B1" class="btn btn-level">B1</button>
            <button data-level="B2" class="btn btn-level">B2</button>
            <button data-level="C1" class="btn btn-level">C1</button>
        </div>
        <button data-mode="grammar" class="btn mode-btn">ГРАММАТИКА</button>
        <button data-mode="cards" class="btn mode-btn">КАРТОЧКИ</button>
        <button data-mode="quiz" class="btn mode-btn">ТЕСТ</button>
        <button data-mode="sentences" class="btn mode-btn">ТРЕНАЖЁР</button>
        <!-- Кнопка "Поделиться" для мобильной версии (скрывается для админа) -->
        <button id="shareBtnMobile" class="btn btn-share-mobile" style="display: none; margin-top: 10px;">🔗 ПОДЕЛИТЬСЯ</button>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/wordsManager.js"></script>
<script src="js/sentencesManager.js"></script>
<script src="js/cardsMode.js"></script>
<script src="js/quizMode.js"></script>
<script src="js/sentencesMode.js"></script>
<script src="js/grammarMode.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>

<script>
    // ===== СКРЫВАЕМ ЛОАДЕР И ПОКАЗЫВАЕМ ПРИЛОЖЕНИЕ ПОСЛЕ ЗАГРУЗКИ =====
    window.addEventListener('load', function() {
        // Показываем приложение
        document.querySelector('.app').classList.add('loaded');
        
        // Скрываем лоадер
        setTimeout(function() {
            document.getElementById('loader').classList.add('hidden');
        }, 300);
    });
    
    // Фикс прокрутки на телефонах
    setTimeout(function() {
        var content = document.querySelector('.content');
        if (content) {
            content.style.overflowY = 'auto';
            content.style.webkitOverflowScrolling = 'touch';
            content.style.paddingBottom = '50px';
        }
    }, 500);
</script>

</body>
</html>
