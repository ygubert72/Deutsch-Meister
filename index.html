<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Немецкий тренажер — Deutsch Meister</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-content">
                <button class="section-toggle-btn" id="lessonsToggleBtn">КУРС ГРАММАТИКИ ▶</button>
                <div class="lessons-container" id="lessonsContainer" style="display: none;">
                    <div id="lessonsGrid" class="lessons-grid"></div>
                </div>

                <div class="section-title">ТРЕНАЖЁР</div>
                <div class="levels-buttons">
                    <button data-level="A1" class="level-btn">A1</button>
                    <button data-level="A2" class="level-btn active">A2</button>
                    <button data-level="B1" class="level-btn">B1</button>
                    <button data-level="B2" class="level-btn">B2</button>
                    <button data-level="C1" class="level-btn">C1</button>
                </div>

                <div class="section-title">РЕЖИМЫ</div>
                <button class="mode-btn active" id="cardsModeBtn">КАРТОЧКИ</button>
                <button class="mode-btn" id="quizModeBtn">ТЕСТ</button>
                <button class="mode-btn" id="sentencesModeBtn">ФРАЗЫ</button>
            </div>
        </div>

        <div class="main-panel">
            <div class="top-bar">
                <div class="counter-label" id="counterLabel">Загрузка...</div>
            </div>
            <div class="content-area" id="contentArea"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
