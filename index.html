<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Немецкий тренажер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Левая панель -->
        <div class="sidebar">
            <div class="sidebar-content">
                <button class="toggle-btn" id="toggleLessonsBtn">КУРС ГРАММАТИКИ ▶</button>
                <div id="lessonsList" style="display: none; margin-top: 10px;"></div>

                <div class="section-title">ТРЕНАЖЁР</div>
                <div class="levels">
                    <button class="level-btn" data-level="A1">A1</button>
                    <button class="level-btn" data-level="A2">A2</button>
                    <button class="level-btn" data-level="B1">B1</button>
                    <button class="level-btn" data-level="B2">B2</button>
                    <button class="level-btn" data-level="C1">C1</button>
                </div>

                <div class="section-title">РЕЖИМЫ</div>
                <button class="mode-btn" data-mode="cards">КАРТОЧКИ</button>
                <button class="mode-btn" data-mode="quiz">ТЕСТ</button>
                <button class="mode-btn" data-mode="sentences">ФРАЗЫ</button>
            </div>
        </div>

        <!-- Правая панель -->
        <div class="main-panel">
            <div class="top-bar">
                <div class="counter" id="counter">Загрузка...</div>
            </div>
            <div class="content" id="content"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
